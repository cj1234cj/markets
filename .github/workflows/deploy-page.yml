name: Publish page only

# A change to the dashboard page shouldn't wait ~15 minutes for a full scrape.
# This republishes site/ with the data files that are already live.
on:
  push:
    branches: [main]
    paths: ["site/index.html"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scrape            # same group as the scrape, so the two never overwrite each other
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the data that's already live
        run: |
          mkdir -p site/data
          base="https://cj1234cj.github.io/markets/data"
          for f in earnings mentions top track; do
            curl -fsS "$base/$f.json?t=$(date +%s)" -o "site/data/$f.json" || echo "no $f.json yet"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Earnings-mention spreadsheet (next 14 days)
        continue-on-error: true
        run: |
          pip install -q requests openpyxl
          python mention_sheet.py --out site/data/earnings_mentions.xlsx
          ls -la site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
