name: Daily prediction-market scrape

on:
  schedule:
    - cron: "0 1,7,13,19 * * *"   # every 6 hours (13:00 UTC = 9am Eastern)
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scraper.py --out data --site site

      - name: Commit raw snapshot
        continue-on-error: true   # a failed push shouldn't block the Pages deploy
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "snapshot $(date -u +%F)"
          # main may have moved since checkout (another run, a manual push): rebase and retry
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed, retrying"
            sleep $((i * 5))
          done
          exit 1

      - name: Copy today's CSVs next to the dashboard
        run: cp -r "data/$(date -u +%F)" site/data/csv || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
